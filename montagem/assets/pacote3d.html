<!doctype html><html><body style="margin:0;background:transparent">
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const P=new URLSearchParams(location.search);
const W=+P.get('w')||900,H=+P.get('h')||1100, rotY=+P.get('ry')||-22, rotX=+P.get('rx')||4, lx=+P.get('lx')||-1.2, ly=+P.get('ly')||2.2;
const r=new THREE.WebGLRenderer({antialias:true,alpha:true,preserveDrawingBuffer:true});
r.setSize(W,H);r.setPixelRatio(1);r.shadowMap.enabled=true;r.shadowMap.type=THREE.VSMShadowMap;r.toneMapping=THREE.ACESFilmicToneMapping;r.toneMappingExposure=0.82;
r.outputEncoding=THREE.sRGBEncoding;r.physicallyCorrectLights=true;
document.body.appendChild(r.domElement);
const sc=new THREE.Scene();
const cam=new THREE.PerspectiveCamera(28,W/H,0.1,50);cam.position.set(0,0.35,4.2);cam.lookAt(0,0.05,0);
// pouch: placa subdividida com "barriga" (cheia no meio, achatada na solda de cima e nas bordas)
const asp=+P.get('asp')||0.7, h=1.2, w=h*asp, seg=80;
function pouchGeo(sinal){const g=new THREE.PlaneGeometry(w,h,seg,seg);const p=g.attributes.position;
 for(let i=0;i<p.count;i++){const x=p.getX(i)/(w/2),y=p.getY(i)/(h/2);
  const top=y>0.86?Math.max(0,1-(y-0.86)/0.14*1.0):1; // solda de cima achatada
  const bx=Math.pow(Math.max(0,1-x*x),0.6), by=Math.pow(Math.max(0,1-Math.pow((y+0.05)/1.05,2)),0.5);
  let z=0.11*bx*by*top; // barriga
  z+=0.004*Math.sin(x*9+y*3)*bx*by; // amassado leve
  p.setZ(i,sinal*z);
  if(y<-0.9){p.setZ(i,sinal*(z+0.04*(( -0.9-y)/0.1)));} // fundo abre (sanfona)
 }g.computeVertexNormals();return g;}
const tex=new THREE.TextureLoader().load(P.get('tex'),()=>{tex.encoding=THREE.sRGBEncoding;tex.anisotropy=8;ok++;});
let ok=0;
const front=new THREE.Mesh(pouchGeo(1),new THREE.MeshStandardMaterial({map:tex,roughness:0.42,metalness:0.0,transparent:true,alphaTest:0.5}));
const back=new THREE.Mesh(pouchGeo(-1),new THREE.MeshStandardMaterial({color:0x8a1c4f,roughness:0.5,side:THREE.BackSide}));
const pouch=new THREE.Group();pouch.add(front,back);
front.castShadow=back.castShadow=true;
pouch.position.y=h/2-0.55;pouch.rotation.y=THREE.MathUtils.degToRad(rotY);pouch.rotation.x=THREE.MathUtils.degToRad(rotX);
sc.add(pouch);
const chao=new THREE.Mesh(new THREE.PlaneGeometry(6,6),new THREE.ShadowMaterial({opacity:0.30}));chao.rotation.x=-Math.PI/2;chao.position.y=-0.56;chao.receiveShadow=true;/* sombra feita na composição */
sc.add(new THREE.HemisphereLight(0xfff4ea,0x553344,1.0));
const sol=new THREE.DirectionalLight(0xfff1e0,2.1);sol.position.set(lx,ly+2.2,1.6);sol.castShadow=true;sol.shadow.mapSize.set(2048,2048);sol.shadow.radius=14;sol.shadow.blurSamples=24;
sol.shadow.camera.left=-2;sol.shadow.camera.right=2;sol.shadow.camera.top=2;sol.shadow.camera.bottom=-2;sc.add(sol);
const brilho=new THREE.PointLight(0xffffff,0.6);brilho.position.set(1.5,0.8,2.5);sc.add(brilho);
(function loop(){r.render(sc,cam);if(ok)window.PRONTO=true;requestAnimationFrame(loop)})();
</script></body></html>
