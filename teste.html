<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Qual conta pagar primeiro?</title>
<meta name="description" content="Teste grátis do Contas da casa: marque as contas da sua casa e veja em que ordem pagar. Sem cadastro.">
<meta property="og:title" content="Qual conta pagar primeiro?">
<meta property="og:description" content="Teste grátis, 7 perguntas, sem cadastro. Veja a ordem das contas da sua casa.">
<meta name="theme-color" content="#111111">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Bebas+Neue&display=swap" rel="stylesheet">
<style>
:root{--bg:#111;--card:#1b1b1b;--card2:#232323;--tx:#f4f1ea;--mut:#a8a39a;--am:#FFD21F;--am2:rgba(255,210,31,.14);--ln:#333;--ok:#7fd18b;--aviso:#fff7d6;--avisotx:#2a2410}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--tx)}
body{font:18px/1.55 Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
main{max-width:520px;margin:0 auto;padding:max(18px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) 48px max(16px,env(safe-area-inset-left))}
.marca{display:flex;align-items:center;gap:10px;margin:4px 0 22px;color:var(--mut);font-size:14px;font-weight:600;letter-spacing:.02em}
.marca .bola{width:34px;height:34px;border-radius:50%;background:var(--am);color:#111;display:grid;place-items:center;font:800 15px Inter,sans-serif}
.marca b{color:var(--tx)}
h1{font:400 50px/1 "Bebas Neue",Impact,"Arial Narrow",sans-serif;letter-spacing:.01em;margin:0 0 16px;color:var(--am);text-wrap:balance}
h2{font-size:24px;line-height:1.3;margin:0 0 18px;font-weight:800;text-wrap:balance}
h3{font-size:19px;margin:0 0 10px;font-weight:800}
p{margin:0 0 14px}
strong,b{font-weight:700}
.am{color:var(--am)}
.mut{color:var(--mut)}
.peq{font-size:15px}
.linhas{list-style:none;padding:0;margin:18px 0 24px;display:grid;gap:10px}
.linhas li{display:flex;gap:12px;align-items:center;background:var(--card);border:1px solid var(--ln);border-radius:14px;padding:12px 14px;font-size:16px}
.linhas li span{font-size:22px}
.topo{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
.voltar{background:none;border:1px solid var(--ln);color:var(--tx);border-radius:999px;padding:10px 16px;font:600 16px Inter,sans-serif;cursor:pointer;min-height:44px}
.conta-p{font-size:14px;color:var(--mut);font-weight:600}
.barra{height:8px;background:var(--card2);border-radius:9px;overflow:hidden;margin:0 0 22px}
.barra i{display:block;height:100%;background:var(--am);transition:width .35s}
.op{display:block;width:100%;text-align:left;background:var(--card);color:var(--tx);border:2px solid var(--ln);border-radius:14px;padding:15px 16px;margin:0 0 10px;font:500 18px/1.35 Inter,sans-serif;cursor:pointer;min-height:56px}
.op:active{transform:scale(.99)}
.op.on{border-color:var(--am);background:var(--am2)}
.grade{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.grade .op{margin:0;text-align:center;padding:14px 8px;font-size:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
.grade .op span{font-size:28px;line-height:1}
.btn{display:block;width:100%;background:var(--am);color:#111;border:0;border-radius:14px;padding:17px;font:800 18px Inter,sans-serif;cursor:pointer;margin-top:10px;min-height:56px;text-align:center;text-decoration:none}
.btn:disabled{opacity:.35;cursor:default}
.btn.sec{background:transparent;color:var(--tx);border:2px solid var(--ln)}
.contador{text-align:center;color:var(--mut);font-size:15px;margin:4px 0 0}
.calc p{opacity:0;transform:translateY(6px);transition:all .5s;font-size:20px}
.calc p.vis{opacity:1;transform:none}
.perfil-tag{display:inline-block;background:var(--am);color:#111;font:800 13px Inter,sans-serif;letter-spacing:.06em;text-transform:uppercase;border-radius:999px;padding:6px 12px;margin-bottom:12px}
.caixa{background:var(--card);border:1px solid var(--ln);border-radius:16px;padding:18px 16px;margin:0 0 16px}
.grupo{border-left:4px solid var(--am);padding:2px 0 2px 14px;margin:0 0 18px}
.grupo .nome{font-weight:800;font-size:18px}
.grupo .pq{font-size:15px;color:var(--mut);margin:2px 0 8px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:var(--card2);border:1px solid var(--ln);border-radius:999px;padding:7px 12px;font-size:16px}
.chip.atraso{border-color:var(--am);background:var(--am2)}
.chip.atraso small{display:block;color:var(--am);font-size:12px;font-weight:700;letter-spacing:.02em}
.vazio{font-size:15px;color:var(--mut)}
ol.passos{padding-left:22px;margin:0 0 12px}
ol.passos li{margin-bottom:8px}
.aviso{background:var(--aviso);color:var(--avisotx);border-radius:16px;padding:18px 16px;margin:0 0 16px}
.aviso h3{color:var(--avisotx)}
.aviso ul{padding-left:20px;margin:8px 0}
.aviso li{margin-bottom:6px}
.nota{font-size:14px;color:var(--mut);font-style:italic}
.rodape{margin-top:34px;padding-top:16px;border-top:1px solid var(--ln);font-size:13px;color:var(--mut);text-align:center}
a{color:var(--am)}
[hidden]{display:none!important}
@media (max-width:360px){h1{font-size:42px}.grade{grid-template-columns:1fr}}
</style>
</head>
<body>
<main id="app" aria-live="polite"></main>
<script>
// Teste grátis "Qual conta pagar primeiro?" (funil/FUNIL-v1.md, seção 3). Sem nome, CPF, e-mail ou valores.
// As respostas são guardadas sem identificar ninguém (tabela quiz_respostas), só para contar perguntas e perfis.
const HANDLE="contasdacasaaa1";
const URL_SB="https://kfvugtrjuqdakbpzvsxq.supabase.co", CHAVE="sb_publishable_hMCt4kaGtY75gMEb3aRi-g_Xh3OkPhx";
const agora=new Date(), VIRADA=agora.getMonth()===11||agora.getMonth()===0; // dezembro e janeiro: "em 2027"
const TITULO=VIRADA?"Qual conta pagar primeiro em 2027?":"Qual conta pagar primeiro?";
const ORIGEM=(new URLSearchParams(location.search).get("o")||"direto").slice(0,40);

const CONTAS=[["Aluguel ou prestação da casa","🏠",1],["Luz","💡",1],["Água","🚿",1],["Gás","🔥",1],["Mercado","🛒",1],["Remédio","💊",1],["Condução","🚌",1],
  ["Celular e internet","📱",3],["Cartão de crédito","💳",2],["Empréstimo","🏦",2],["Carnê de loja","🧾",3],["Escola ou creche","🎒",3],["Ajuda a alguém da família","🤝",3],["Outra conta","📄",3]];
const GRUPO=Object.fromEntries(CONTAS.map(c=>[c[0],c[2]]));
const ATRASO_MAP={"Luz ou água":["Luz","Água"],"Aluguel ou prestação":["Aluguel ou prestação da casa"],"Cartão":["Cartão de crédito"],"Empréstimo":["Empréstimo"],"Carnê de loja ou outra":["Carnê de loja","Outra conta"]};

const P=[
 {id:"quem",t:"Quem cuida das contas da casa?",o:["Eu cuido de tudo","Eu e mais alguém, juntos","Eu ajudo alguém da família com as contas dele(a)","Estou começando a cuidar agora"]},
 {id:"cena",t:"O dinheiro entrou. Tem mais conta do que dinheiro. O que você costuma fazer primeiro?",o:["Pago a que está cobrando mais forte (ligação, aviso de corte)","Pago um pouco de cada uma, para ninguém ficar sem nada","Pago pela data: a que vence primeiro vai primeiro","Pago tudo: no meu mês costuma dar","Fico sem saber por onde começar"]},
 {id:"contas",t:"Toque nas contas que a sua casa tem.",multi:"grade"},
 {id:"fim",t:"No fim do mês, como costuma ficar?",o:["Sobra um pouco","Fica no zero, certinho","Falta, e eu cubro com o cartão ou com empréstimo","Falta, e alguma conta acaba atrasando"]},
 {id:"atraso",t:"Alguma conta já atrasou ou chegou com aviso de corte? Marque se quiser.",multi:"lista",o:["Nenhuma está atrasada","Luz ou água","Aluguel ou prestação","Cartão","Empréstimo","Carnê de loja ou outra","Prefiro não dizer"],sozinhas:["Nenhuma está atrasada","Prefiro não dizer"],pular:true},
 {id:"sono",t:"O que mais tira o seu sono quando pensa nas contas?",o:["O cartão de crédito","As contas de começo de ano (IPTU, IPVA, material, a fatura do Natal)","Não saber direito quanto tenho e quanto devo","Ter que ligar para negociar e não saber o que falar","Dividir as contas com quem mora junto"]},
 {id:"antes",t:"Você já tentou se organizar antes? Como foi?",o:["Tentei planilha e larguei","Uso caderno: funciona mais ou menos","Tentei aplicativo e achei difícil","Nunca tentei de verdade","Tenho meu jeito e ele funciona"]}
];
const R={contas:[],atraso:[]}; let tela=-1;
const app=document.getElementById("app");
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const marca=`<div class="marca"><div class="bola">CC</div><div><b>Contas da casa</b><br>@${HANDLE}</div></div>`;
const rodape=`<div class="rodape">Contas da casa · @${HANDLE}<br>Nunca pedimos senha, código ou pagamento pelo direct.<br>Suas respostas são contadas sem identificar você.</div>`;
function topo(i){return `<div class="topo"><button class="voltar" data-voltar>← Voltar</button><span class="conta-p">Pergunta ${i+1} de 7</span></div><div class="barra"><i style="width:${(i+1)/7*100}%"></i></div>`}

function abertura(){app.innerHTML=`${marca}<h1>${TITULO}</h1>
<p>Quando o dinheiro não dá para tudo, a pergunta não é "como economizar". É <b>qual conta vem primeiro</b>.</p>
<p>Marque as contas da sua casa e veja a ordem, separada em 3 grupos. No fim, um primeiro passo para fazer hoje.</p>
<ul class="linhas"><li><span>📝</span>7 perguntas, uma por tela</li><li><span>🔒</span>Sem cadastro: não pedimos nome, CPF, senha nem banco</li><li><span>✅</span>Grátis, com o resultado na hora</li></ul>
<button class="btn" data-ir="0">Começar o teste</button>${rodape}`}

function pergunta(i){const q=P[i];let corpo="";
 if(q.multi==="grade"){corpo=`<div class="grade">${CONTAS.map(c=>`<button class="op ${R.contas.includes(c[0])?"on":""}" data-conta="${esc(c[0])}" aria-pressed="${R.contas.includes(c[0])}"><span aria-hidden="true">${c[1]}</span>${esc(c[0])}</button>`).join("")}</div>
  <p class="contador">${R.contas.length} conta${R.contas.length===1?"":"s"} marcada${R.contas.length===1?"":"s"}</p><button class="btn" data-prox ${R.contas.length?"":"disabled"}>Continuar</button>`}
 else if(q.multi==="lista"){corpo=q.o.map(o=>`<button class="op ${R.atraso.includes(o)?"on":""}" data-multi="${esc(o)}" aria-pressed="${R.atraso.includes(o)}">${esc(o)}</button>`).join("")+`<button class="btn" data-prox>${R.atraso.length?"Continuar":"Pular"}</button>`}
 else corpo=q.o.map(o=>`<button class="op ${R[q.id]===o?"on":""}" data-um="${esc(o)}">${esc(o)}</button>`).join("");
 app.innerHTML=`${topo(i)}<h2>${esc(q.t)}</h2>${corpo}`;window.scrollTo(0,0)}

function perfil(){const c=R.cena,f=R.fim||"",falta=f.startsWith("Falta");
 if(c.startsWith("Pago a que está")) return 1;
 if(c.startsWith("Fico sem saber")) return falta?1:3;
 if(c.startsWith("Pago um pouco")) return 2;
 if(c.startsWith("Pago pela data")) return 3;
 if(c.startsWith("Pago tudo")) return falta?3:4;
 return 3}
const ABRE={"Eu cuido de tudo":"Quem cuida de tudo sozinho(a) carrega muita conta na cabeça.","Eu e mais alguém, juntos":"Quando duas pessoas dividem as contas, combinar a ordem evita muita briga.","Eu ajudo alguém da família com as contas dele(a)":"Ajudar alguém com as contas dele(a) pede um jeito claro.","Estou começando a cuidar agora":"Começar a cuidar das contas agora tem uma vantagem: dá para começar já sabendo o que vem."};
const PERFIS={
1:{nome:"Quem apaga incêndio",diag:`<p>Quando o dinheiro entra, a primeira conta paga é a que <b>grita mais alto</b>: a ligação de cobrança, o aviso de corte, a mensagem do carnê.</p><p>Faz todo sentido: é o jeito de apagar o fogo que está mais perto. Quem vive assim não é desorganizado(a). Está cansado(a) de correr.</p><p>O problema é que quem grita mais alto nem sempre é a conta mais importante. Às vezes o barulho vem do 3º grupo, e a conta que cresce em silêncio, como o cartão, fica para trás.</p>`,
 passo:`<ol class="passos"><li>Pegue um papel e escreva só as contas do <b>1º grupo</b> que você marcou.</li><li>Do lado de cada uma, ponha o valor, mais ou menos. Some.</li><li>Esse número é <b>o primeiro dinheiro</b> do mês. No dia em que o dinheiro cair, separe ele antes de qualquer outra coisa.</li></ol><p>E quando alguém ligar cobrando: você não precisa decidir na hora. Pode dizer <b>"Vou olhar minhas contas e retorno amanhã"</b>. Decidir com a lista na mão é diferente de decidir com o telefone no ouvido.</p>`},
2:{nome:"Quem divide um pouco para cada",diag:`<p>Quando não dá para tudo, você paga <b>um pouco de cada uma</b>. Ninguém fica sem nada, ninguém corta nada de uma vez.</p><p>É um jeito cuidadoso. O lado ruim é que, assim, <b>várias contas podem ficar atrasadas ao mesmo tempo</b>. E as do 2º grupo, como o cartão, cobram sobre o que ficou faltando.</p><p>Não é falta de cuidado. É que ninguém mostrou que algumas contas aguentam esperar uma conversa e outras não.</p>`,
 passo:`<ol class="passos"><li>Em vez de dividir o dinheiro entre todas, pague <b>o 1º grupo inteiro</b> primeiro.</li><li>O que sobrar vai para o <b>2º grupo</b>, começando pelo cartão.</li><li>As do <b>3º grupo</b> que não couberem: escolha <b>uma</b> e ligue antes do vencimento para perguntar se dá para mudar a data ou a parcela.</li></ol><p>Se você divide as contas com alguém, mostre a lista dos 3 grupos para essa pessoa hoje à noite. Decidir a ordem juntos evita a briga do "por que você pagou essa e não aquela?".</p>`},
3:{nome:"Quem paga pela data",diag:`<p>Você paga as contas <b>na ordem em que vencem</b>. A do dia 5 antes da do dia 10. É organizado e fácil de seguir.</p><p>O ponto cego é que <b>a data diz quando, mas não diz o que importa mais</b>. Se o carnê vence no dia 8 e a luz no dia 12, pela data o carnê vai primeiro. E se o dinheiro acabar no dia 10, quem fica para trás é a luz.</p>`,
 passo:`<ol class="passos"><li>Pegue o calendário, ou o papel onde você anota os vencimentos.</li><li>Do lado de cada conta, escreva o número do grupo dela: <b>1, 2 ou 3</b>.</li><li>A regra fica assim: <b>a data diz quando, o grupo diz quem passa na frente</b>. Se duas contas disputam o mesmo dinheiro, a do grupo menor ganha.</li></ol>`},
4:{nome:"Quem segura o mês, mas o ano surpreende",diag:`<p>O mês costuma fechar. Você paga em dia, sabe mais ou menos o que entra e o que sai.</p><p>O que pega são as contas que <b>vêm uma vez por ano</b>: o IPTU, o material escolar, a matrícula, a fatura que chega em janeiro com o Natal dentro. Elas não aparecem no mês comum, então não têm lugar no dinheiro do mês. E quando chegam, chegam juntas.</p>`,
 passo:`<ol class="passos"><li>Escreva as contas que vêm uma vez por ano na sua casa e o mês de cada uma.</li><li>Pegue a mais próxima. Divida o valor dela pelo número de meses que faltam.<br><span class="mut peq">Exemplo: uma conta de R$ 480 que vem daqui a 4 meses = R$ 120 por mês.</span></li><li>Separe esse valor no dia em que o dinheiro cair, junto com o 1º grupo.</li></ol>`}};
const SONO={"O cartão de crédito":"Sobre o cartão: se a fatura não couber inteira, ligue <b>antes do vencimento</b> e pergunte o total de cada jeito de pagar. Compare antes de aceitar.",
 "As contas de começo de ano (IPTU, IPVA, material, a fatura do Natal)":"Sobre as contas de começo de ano: divida cada uma pelos meses que faltam e separe esse valor todo mês, junto com o 1º grupo.",
 "Não saber direito quanto tenho e quanto devo":"Sobre não saber quanto tem e quanto deve: uma folha com todas as contas e o dia de cada uma já mostra o mês inteiro de uma vez.",
 "Ter que ligar para negociar e não saber o que falar":"Sobre ligar para negociar: você pode dizer <b>\"Quero saber o total de cada jeito de pagar. Pode me mandar por escrito?\"</b> e decidir depois, com calma.",
 "Dividir as contas com quem mora junto":"Sobre dividir com quem mora junto: mostrem a lista dos 3 grupos um para o outro e decidam a ordem juntos, antes do dinheiro cair."};
const ANTES={"Tentei planilha e larguei":"Se você já tentou planilha e largou, não foi falta de força de vontade: planilha pede que você faça a conta toda sozinho(a). Comece só pelo 1º grupo.",
 "Uso caderno: funciona mais ou menos":"O caderno que você já usa serve: escreva o número do grupo (1, 2 ou 3) do lado de cada conta.",
 "Tentei aplicativo e achei difícil":"Não precisa de aplicativo para começar: um papel e os 3 grupos já mudam a ordem.",
 "Nunca tentei de verdade":"Começar pelo 1º grupo é o jeito mais leve de começar. Uma lista curta já ajuda.",
 "Tenho meu jeito e ele funciona":"Se o seu jeito funciona, ótimo. Os 3 grupos só ajudam a decidir quando duas contas disputam o mesmo dinheiro."};

function atrasadas(){return R.atraso.flatMap(a=>ATRASO_MAP[a]||[])}
function blocoOrdem(){const atr=atrasadas();const todas=[...new Set([...R.contas,...atr])];
 const G={1:[],2:[],3:[]};todas.forEach(c=>G[GRUPO[c]||3].push(c));
 const ord=l=>l.sort((a,b)=>(atr.includes(b)?1:0)-(atr.includes(a)?1:0));
 const chips=l=>l.length?`<div class="chips">${ord(l).map(c=>atr.includes(c)?`<span class="chip atraso">${esc(c)}<small>Ligue antes que piore</small></span>`:`<span class="chip">${esc(c)}</span>`).join("")}</div>`:`<p class="vazio">Nenhuma conta marcada aqui.</p>`;
 return `<div class="caixa"><h3>Suas contas, na ordem</h3>
 <div class="grupo"><div class="nome">1º · A casa de pé</div><div class="pq">Vem antes de tudo: sem ela, a casa para.</div>${chips(G[1])}</div>
 <div class="grupo"><div class="nome">2º · O que cresce se atrasar</div><div class="pq">Quando não é pago inteiro, o que falta pode crescer no mês seguinte.</div>${chips(G[2])}</div>
 <div class="grupo"><div class="nome">3º · O que dá para conversar</div><div class="pq">Também é conta e também importa, mas normalmente dá para mudar a data ou a parcela.</div>${chips(G[3])}</div>
 <p class="nota">Usa o celular para trabalhar? Ele sobe para o 1º grupo. A ordem é sua: você pode mudar. É uma orientação geral, não uma decisão por você.</p></div>`}

function separando(){const atr=atrasadas().filter((v,i,a)=>a.indexOf(v)===i).length,n=new Set([...R.contas,...atrasadas()]).size;
 app.innerHTML=`${marca}<div class="calc"><p>Você marcou <b class="am">${n} conta${n===1?"":"s"}</b>.</p><p>Separando nos 3 grupos: a casa de pé, o que cresce se atrasar, o que dá para conversar...</p><p>${atr?`<b class="am">${atr} conta${atr===1?"":"s"}</b> sobe${atr===1?"":"m"} para o topo porque já atrasou${atr===1?"":"ram"}.`:"Montando a sua ordem..."}</p></div>`;
 const ps=app.querySelectorAll(".calc p");ps.forEach((p,i)=>setTimeout(()=>p.classList.add("vis"),300+i*900));setTimeout(resultado,3400);salvar()}

function resultado(){const pf=perfil(),X=PERFIS[pf];
 const aperto=R.fim==="Falta, e alguma conta acaba atrasando"&&(R.atraso.includes("Luz ou água")||R.atraso.includes("Aluguel ou prestação"));
 let abre=ABRE[R.quem]||"";if(pf===3&&R.cena.startsWith("Fico sem saber"))abre="Você ainda não tem um jeito fixo, e tudo bem. Muita gente começa pagando pela data.";
 const msg=encodeURIComponent(`Fiz um teste grátis que mostra qual conta pagar primeiro. Faz também: ${location.origin+location.pathname}`);
 app.innerHTML=`${marca}<span class="perfil-tag">Seu resultado</span><h1>${X.nome}</h1><p class="mut">${esc(abre)}</p>
 <div class="caixa"><h3>O que acontece na sua casa</h3>${X.diag}</div>
 ${blocoOrdem()}
 ${aperto?`<div class="aviso"><h3>Um aviso importante, com carinho.</h3><p>Pelas suas respostas, falta dinheiro até para contas da casa de pé, como luz, água ou moradia. Quando é assim, <b>organizar ajuda, mas não resolve sozinho</b>. E não é culpa sua.</p><p>Existem lugares que ajudam <b>de graça</b>:</p><ul><li><b>Defensoria Pública</b> da sua cidade: ajuda a negociar várias dívidas juntas, guardando um mínimo para viver (Lei do Superendividamento, 14.181/2021).</li><li><b>Procon</b>: orienta sobre cobranças e acordos.</li><li><b>CRAS</b> (assistência social da prefeitura): orienta sobre benefícios e tarifas sociais.</li><li><b>Empresa de luz e de água</b>: pergunte se a sua casa tem direito à tarifa social.</li></ul></div>`:""}
 <div class="caixa"><h3>Seu primeiro passo, para fazer hoje</h3>${X.passo}</div>
 ${SONO[R.sono]?`<div class="caixa"><p style="margin:0">${SONO[R.sono]}</p></div>`:""}
 ${ANTES[R.antes]?`<p>${esc(ANTES[R.antes])}</p>`:""}
