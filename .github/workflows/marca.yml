name: Imagens da marca

# Rodado à mão (workflow_dispatch): gera os logos e as imagens de clima pedidos em automacao/marca/pedidos.json.
on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  gerar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Gerar imagens da marca
        run: python montagem/marca_imagens.py
